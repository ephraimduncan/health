name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: deno ci
      - name: Tag matches every manifest
        run: deno task check:versions "$GITHUB_REF_NAME"
      - run: deno task test-all
      - run: deno publish --dry-run
      - run: |
          for dir in packages/*/; do
            (cd "$dir" && npm pack --dry-run --ignore-scripts)
          done

  jsr:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno ci
      - run: deno publish

  npm:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: deno ci
      - run: deno task build
      - name: Use NPM_TOKEN when set, otherwise npm trusted publishing (OIDC)
        if: env.NPM_TOKEN != ''
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
      - name: Publish @openstatus/health first, then its dependents
        run: |
          set -euo pipefail
          publish() {
            local dir="$1"
            local name version
            name="$(node -p "require('$dir/package.json').name")"
            version="$(node -p "require('$dir/package.json').version")"
            if [ "$(npm view "$name@$version" version 2>/dev/null || true)" = "$version" ]; then
              echo "::notice::$name@$version is already on npm, skipping"
              return
            fi
            (cd "$dir" && npm publish --access public --ignore-scripts --provenance)
          }
          publish ./packages/health
          for dir in ./packages/*/; do
            dir="${dir%/}"
            [ "$dir" = "./packages/health" ] && continue
            publish "$dir"
          done
